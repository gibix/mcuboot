# MCUboot-side Kconfig for the "MCUboot is the only bootloader" arrangement:
# MCUboot lives wholly in BFM, dfu_boot is gone, and every host-side write goes
# through mcumgr/SMP over USB CDC-ACM. Passed to
# `west build ... bootloader/mcuboot/boot/zephyr` via -DEXTRA_CONF_FILE=.
# Pairs with mcuboot.overlay in this directory; see that file for the flash layout.
#
# 🔴 This image must fit ONE 64K BFM Dual-Boot slot.
# Check after every change - the build prints it:
#     FLASH:  ~60500 B    64 KB    ~92.3%    <- ~5 KB spare, upgrade-only
#
# Measured 2026-08-17, all wholly in BFM with USB CDC-ACM recovery and the hooks
# module:
#
#   A/B swap-using-move, logging off           62528 B   95.4%
#   upgrade-only, logging off                 ~60500 B  ~92.3%   <- current
#   single slot, logging off                   58900 B   89.9%
#
# Where it goes: USB is 18.9 KB of it (udc driver 8.0 + subsys/usb 10.9),
# MCUboot's own code only ~10 KB.
#
# If a change pushes this over, in order: CONFIG_BOOT_SERIAL_IMG_GRP_HASH=n
# (costs the hash in `mcumgr image list`), CONFIG_USBD_BOS_SUPPORT=n +
# CONFIG_USBD_VREQ_SUPPORT=n, CONFIG_HWINFO=n (costs the USB serial-number
# descriptor) - together ~1 KB. Beyond that the choice is USB recovery for UART
# on sercom6 (~26 KB, and with it the entire "no adapter, same cable as the
# upload" premise). Prefer trimming Zephyr: clock_control alone is 4.7 KB and
# a bootloader needs very little of it.
#
# The 64K itself is a CHOICE, not a hardware limit. BFM is 128K at 0x08000000
# and the part supports a Single Boot model where one image spans both panels
# (DS 31.2.17.3) - there is no mode bit, the Boot ROM just compares the two
# panels' sequence numbers either way. Taking it doubles the budget and costs
# the Dual-Boot property this arrangement is built on: a bootloader update that
# survives power loss, because the old image keeps booting until the new one is
# written, verified and promoted. Worth revisiting if MCUboot ever has to carry
# signature verification, which will not fit in what is left here.

# No secure boot: hash-only. The image hash is generated when the combined
# loader+sketch bundle is assembled (CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE on
# the loader side, zephyr-sketch-tool for the bundle) - imgtool cannot be used,
# platform.txt recipes may only invoke Arduino toolchain tools.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# --- Placement: wholly inside BFM ---------------------------------------------
#
# The earlier arrangements (deleted 2026-08-18, see README) put MCUboot's body
# in PFM and needed CONFIG_ROMSTART_RELOCATION_ROM=y to leave a vector-table
# stub at the chip's true reset address. Here the whole image IS at the reset
# address, so the stub would be a second vector table on top of itself.
#
# `zephyr,flash = &flash0` (the overlay) puts the linker on the node that spans
# BFM+PFM, which on its own would offer a 65 MB region; the &boot_partition
# code partition then pins this image to offset 0 (0x08000000) and caps it at
# the 64K Dual-Boot slot size. Both numbers come from the partition, so there is
# no second place to keep in sync. Verify the cap held with:
#     arm-zephyr-eabi-readelf -l zephyr.elf   # ONE LOAD segment, at 0x08000000
CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=y

# --- Multi-image, upgrade-only, no validation ---------------------------------
#
# Two images: image 0 is the loader (288K slot0), image 1 is the sketch (728K
# slot2). Each is uploaded independently via DIRECT_IMAGE_UPLOAD in MCUboot
# serial recovery.
#
# The sketch is raw zsk/ELF data, NOT an MCUboot image — MCUboot writes it to
# slot2 via SMP but never validates or chainloads it. The loader finds and runs
# it. Integrity is the host's responsibility.
#
# Dummy 4K secondaries (slot1, slot3) exist because sysflash.h references them
# at compile time. MCUboot opens them, finds no IMAGE_MAGIC, and skips.
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_BOOT_UPGRADE_ONLY=y

# No boot-time validation of primary slots. The loader validates the sketch
# header itself (zsk magic check). This is the trade-off that eliminates the
# combined bundle, the staging slot, and the sketch_install hook.
CONFIG_BOOT_VALIDATE_SLOT0=n

# --- Recovery transport: mcumgr/SMP over USB CDC-ACM ---------------------------
#
# BOOT_SERIAL_CDC_ACM is NOT the option to use: it selects USB_DEVICE_STACK, the
# legacy stack, for which this SoC has no driver at all (it has only the
# next-gen UDC driver, drivers/usb/udc/udc_mchp_g2.c). Same for MCUboot's own
# BOOT_USB_DFU_WAIT/_GPIO.
#
# BOOT_SERIAL_UART with `zephyr,uart-mcumgr` pointed at the *usbd* CDC-ACM node
# is the way in: usbd_cdc_acm registers an ordinary Zephyr UART device, and
# BOOT_SERIAL_UART has no USB dependency whatsoever.
#
# That alone would link but never enumerate - MCUboot has no bring-up for the
# next USB stack (boot/zephyr/main.c only knows the legacy usb_enable()).
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT is Zephyr's own answer to exactly that
# (subsys/usb/device_next/app/cdc_acm_serial.c): it defines the usbd context,
# registers the class and calls usbd_init() from a SYS_INIT. The board defconfig
# turns it off for MCUboot builds
# (boards/common/usb/Kconfig.cdc_acm_serial.defconfig: `default y if !MCUBOOT`),
# so it must be asked for explicitly here.
#
# 🔴 ENABLE_AT_BOOT is deliberately OFF. usbd_enable() is what asserts the D+
# pull-up, and MCUboot sits in the double-reset window on EVERY boot, not just a
# double-tap - so enabling at boot put a phantom port on the bus for that whole
# second. A board that had just reset enumerated as this bootloader, and the
# 1200-bps touch, which only the loader acts on, went nowhere: measured on
# hardware, a touch 1 s after boot was ignored while the same touch at 10 s
# worked every time. boot/arduino/hooks (mcuboot fork) enables USB when recovery is actually
# entered instead, so the port exists only when something can answer on it.
#
# Shutting the device down again before chainloading is also ours to do -
# MCUboot only calls the legacy usb_disable() - and lives in the same module.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n

# How the board presents itself while in recovery. Distinct from the loader's
# runtime PID (0x008e/0x007e) so boards.txt can tell the two states apart, and
# so arduino-cli's wait-for-upload-port sees a genuinely new port after the
# 1200-bps touch.
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Arduino"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Nano Chandler bootloader"
CONFIG_CDC_ACM_SERIAL_VID=0x2341
CONFIG_CDC_ACM_SERIAL_PID=0x018e

# Upload straight into the slot the host names, rather than always into the
# secondary. Iteration 1 aims that at the primary: one pass over the wire, no
# swap, no second 512K write. An interrupted upload leaves the primary
# unbootable, which is recoverable by definition - this bootloader is in BFM and
# another double-tap always gets back in here.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# The SMP line is the ONLY transport. No networking, no IP stack, no WiFi, no
# Ethernet in the bootloader. Anything that pulls NET_* in here will blow the
# 64K budget long before it does anything useful.

# Buffers for the SMP line. The unaligned buffer covers writes that do not land
# on a write-block boundary.
#
# 🔴 BOOT_LINE_BUFS is not a tuning knob, it is a correctness one. The RX
# interrupt handler takes one buffer per LINE and only gets it back once the
# recovery loop has consumed that line, so a host writing a frame back to back
# needs as many buffers as the frame has lines - a 1024-byte frame is 1368
# base64 characters, i.e. 12 lines of 124. With the default 8 the handler runs
# out mid-frame, drops the rest, and the bootloader never answers: from the
# host it is indistinguishable from a board that is not in recovery at all.
# (Diagnosed on hardware 2026-08-17.)
#
# 16 covers the largest frame MAX_RECEIVE_SIZE permits, with margin, for 1 KB of
# RAM on a part where RAM is not the scarce resource. The host tool separately
# keeps its default chunk inside a *stock* bootloader's 8 buffers, so it also
# works against boards that do not set this.
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=1024
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=8

# --- Entrance -----------------------------------------------------------------
#
# Two ways in, both landing on the same cookie (see the overlay's dfu_cookie
# node and recovery_cookie.dtsi in this directory):
#
#   - a physical double-tap of reset,
#   - a host 1200-bps touch, which makes the running loader/sketch arm the same
#     cookie and reset (variants/.../variant.c:_on_1200_bps). This is what lets
#     `arduino-cli upload` work with no manual gesture at all.
#
# The double-reset entrance is a commit in the gibix/mcuboot fork (pinned in
# west.yml), not an upstream MCUboot feature. `west update` fetches it.
#
# BOOT_SERIAL_ENTRANCE_GPIO defaults to y whenever GPIO is enabled and would
# demand a "mcuboot_button0" alias this board does not have.
CONFIG_BOOT_SERIAL_DOUBLE_RESET=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Enter serial recovery when there is no bootable image, instead of panicking.
#
# 🔴 Without this a board whose slot0 is invalid - an interrupted upload, a bad
# sketch install - reaches FIH_PANIC in main() and spins there forever. It never
# reaches the double-reset check, so the cookie is not consumed and a double-tap
# does nothing; USB is never brought up either. The only way back is SWD, which
# defeats the point of having recovery in the bootloader at all.
#
# Found 2026-08-20 by bricking the board exactly that way. Now an unbootable
# slot0 lands straight in recovery, which is where a full upload can fix it.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# --- Indication ---------------------------------------------------------------
#
# LED_BUILTIN breathes while in recovery, and USB is shut down before the
# chainload: both live in the boot/arduino/hooks module (mcuboot fork), hung off MCUboot's own
# status-change callback rather than patched in. Pass it with
# -DEXTRA_ZEPHYR_MODULES; see extra/mcuboot/README.md.
#
# MCUBOOT_INDICATION_LED stays off on purpose - it would drive the same pin
# steadily on and fight the fade.
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_MCUBOOT_INDICATION_LED=n

# The fade's brightness resolution is capped by the tick (a sleeping thread
# cannot resolve a sub-tick pulse); the module BUILD_ASSERTs on this.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- Console ------------------------------------------------------------------
#
# Silent. The board's default console is the USB CDC-ACM port, which is the
# recovery transport here - MCUboot refuses to build with the console and
# uart-mcumgr on the same device. See extra/mcuboot/README.md for how to point a
# console at sercom6 temporarily while debugging.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# With no console there is nowhere for a log line or the banner to go, so the
# whole logging subsystem is dead weight - 976 B of format strings and minimal
# backend, which at 96% of the budget is not nothing. Re-enable both (plus
# CONFIG_LOG_MODE_MINIMAL and a real console) when debugging; see
# extra/mcuboot/README.md.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# --- Trim ---------------------------------------------------------------------
#
# Zephyr defaults that earn their place in an application and none of it in a
# bootloader. Sizes measured 2026-08-20 by aggregating the map file per object.
#
# Nothing here costs functionality this image uses. If any of it has to come
# back, the header at the top of this file lists what to give up instead.

# 1058 B. No user mode, no threads that are not ours, nothing to isolate; the
# bootloader runs for a second and chainloads. MPU_STACK_GUARD goes with it,
# which is the only real loss - and a bootloader stack overflow would present as
# a fault either way.
CONFIG_ARM_MPU=n

# 1992 B. The External Interrupt Controller exists for GPIO interrupts, and this
# image has none: entrance is the RAM cookie plus a double reset
# (BOOT_SERIAL_ENTRANCE_GPIO=n above), and the LED is an output. GPIO itself
# stays for the LED.
CONFIG_INTC_MCHP_EIC_G1=n

# The SERCOM UART driver (1923 B) is dropped too, but it cannot be switched off
# here - UART_MCHP_SERCOM_G1 is promptless and follows the devicetree. The
# overlay disables sercom0/1/6 instead; see the note there.

# ~1400 B of fault.c. With CONSOLE=n and LOG=n the dump has nowhere to go - the
# full-verbosity handler formats registers into a sink that discards them. The
# fault still halts the CPU, which is all this image can usefully do about one;
# read the PC over SWD instead (the flash-chandler skill covers it).
CONFIG_FAULT_DUMP=0

# ~750 B. printk with no console is a formatter writing to nothing. This also
# drops libc's vfmprintf, which nothing else here pulls in.
CONFIG_PRINTK=n

# --- Stacks -------------------------------------------------------------------
#
# The USB stack on this SoC is not shy: these are the values samples/dfu_boot
# arrived at empirically for the same UDC driver and the same CDC-ACM traffic.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_USBD_THREAD_STACK_SIZE=4096
