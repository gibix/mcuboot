#
# MCUboot in BFM, USB DFU recovery. Pairs with mcuboot.overlay.
#
# 🔴 Must fit ONE 64K BFM Dual-Boot slot (~5 KB spare at 92%).
# If over budget, trim in order: BOOT_SERIAL_IMG_GRP_HASH=n,
# USBD_BOS_SUPPORT=n + USBD_VREQ_SUPPORT=n, HWINFO=n (~1 KB total).
# Beyond that: swap USB recovery for UART (~26 KB savings).

# Hash-only, no secure boot.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# --- Placement: wholly in BFM, no relocation stub needed.
CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=y

# --- Multi-image, upgrade-only. Sketch is raw data in slot2 (not an MCUboot image).
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_BOOT_UPGRADE_ONLY=y

# No slot0 validation — eliminates the combined bundle and staging machinery.
CONFIG_BOOT_VALIDATE_SLOT0=n

# --- Recovery: CDC-ACM (keeps event loop alive) + DFU (upload transport).
# 🔴 BOOT_SERIAL_CDC_ACM selects the legacy stack — no driver on this SoC.
# Use BOOT_SERIAL_UART pointed at the usbd CDC-ACM node instead.
# usb_setup.c registers both CDC-ACM + DFU; ENABLE_AT_BOOT off (hooks.c).
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n

# --- USB DFU: alt 0=loader, alt 1=sketch, alt 2=BFM. Auto-reset 2s after download.
CONFIG_USBD_DFU=y
CONFIG_USBD_DFU_NUMOF_IMAGES=3
CONFIG_USBD_DFU_TRANSFER_SIZE=512
CONFIG_USBD_DFU_ENABLE_UPLOAD=n

# Recovery PID — distinct from the loader's runtime PID so arduino-cli sees a new port.
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x018e
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_PRODUCT="Nano Chandler bootloader"

# Upload directly to primary slot (no swap). Interrupted upload → double-tap to recover.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# 🔴 BOOT_LINE_BUFS=16: one buffer per line; default 8 silently truncates
# frames >8 lines and the bootloader never answers.
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=1024
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=64

# --- Entrance: double-tap reset OR 1200-bps touch from loader/sketch.
CONFIG_BOOT_SERIAL_DOUBLE_RESET=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# 🔴 Without this, invalid slot0 → FIH_PANIC, no USB, only SWD recovers.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# --- Indication: breathing LED via hooks module. INDICATION_LED=n to avoid conflict.
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_MCUBOOT_INDICATION_LED=n

# Breathing LED needs tick resolution for software PWM.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# --- Console: off (CDC-ACM is the recovery transport, can't also be console).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# No console → logging is dead weight.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# --- Trim: bootloader doesn't need these Zephyr defaults.
CONFIG_ARM_MPU=n
# No GPIO interrupts in this image.
CONFIG_INTC_MCHP_EIC_G1=n

# SERCOM UART dropped via overlay (promptless Kconfig follows DT).
# Fault dump has nowhere to go without console; read PC over SWD.
CONFIG_FAULT_DUMP=0

CONFIG_PRINTK=n

# --- Stacks -------------------------------------------------------------------
#
# Empirical minimums for the PIC32CK UDC driver + CDC-ACM + DFU traffic.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_USBD_THREAD_STACK_SIZE=4096
